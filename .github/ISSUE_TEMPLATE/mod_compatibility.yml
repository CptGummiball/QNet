name: Mod compatibility
description: A block or feature of another mod does not work together with QNet.
labels: ["compatibility", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        QNet connects to other mods through the standard interfaces of each loader (Fabric Transfer API and Team Reborn Energy, NeoForge capabilities). See [Resources and Compatibility](https://github.com/CptGummiball/QNet/wiki/Resources-and-Compatibility).

        Known limits, no need to report: see the wiki (Supported Versions, FAQ).

  - type: input
    id: othermod
    attributes:
      label: Other mod and version
      placeholder: "ExampleMod 2.3.1"
    validations:
      required: true

  - type: input
    id: block
    attributes:
      label: Block or machine
      description: Which block of that mod? (name, and the id if you know it, e.g. from F3)
      placeholder: "Example Furnace (examplemod:furnace)"
    validations:
      required: true

  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      description: Your version is not listed? Please use the [version request](https://github.com/CptGummiball/QNet/issues/new?template=version_request.yml) form instead.
      options:
        - "1.21.1"
        - "1.21.11"
        - "26.1.2"
        - "26.2"
        - "26.3"
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options:
        - Fabric
        - NeoForge
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: QNet jar and loader version
      placeholder: "qnet-1.0.0+mc1.21.1-neoforge.jar, NeoForge 21.1.252"
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: What happens?
      options:
        - It does not connect / interact at all
        - It interacts, but wrongly
        - Resources are lost or duplicated
        - Crash
        - Something else
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details and steps to reproduce
      description: What exactly did you do? Does it work with a vanilla block in the same place? Screenshots help.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`logs/latest.log` (drag and drop, or a paste link), and a crash report if there was one."
