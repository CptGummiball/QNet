name: Bug report
description: Something in QNet does not work as described, crashes or loses resources.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please check the [FAQ](https://github.com/CptGummiball/QNet/wiki/FAQ) first. 

        If the problem only happens together with another mod's machine, please use the **Mod compatibility** template instead.
        QNet for a Minecraft version that is not listed below? Please use the **[Version request](https://github.com/CptGummiball/QNet/issues/new?template=version_request.yml)** form.

  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      description: The QNet jar name contains the Minecraft version it is made for. Your version is not listed? Please use the [version request](https://github.com/CptGummiball/QNet/issues/new?template=version_request.yml) form instead.
      options:
        - "1.21.1"
        - "1.21.11"
        - "26.1.2"
        - "26.2"
        - "26.3"
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options:
        - Fabric
        - NeoForge
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: QNet jar and loader version
      description: The exact file name of the QNet jar, and the Fabric Loader + Fabric API or NeoForge version.
      placeholder: "qnet-1.1.0+mc26.2-fabric.jar, Pipster 1.2.0, Fabric Loader 0.19.5, Fabric API 0.161.0+26.2"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      options:
        - Singleplayer
        - Dedicated server (multiplayer)
        - LAN / integrated server
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Area
      multiple: true
      options:
        - Gameplay
        - GUI / screens
        - Rendering / models / textures
        - Recipes
        - Saving / loading / world upgrade
        - Performance / server lag
        - Integrations with other mods
        - Crash
        - Other

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what you saw. If resources were lost or duplicated, say which and how many.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smaller the setup, the faster it can be fixed. Screenshots help a lot.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: The full mod list, or at least the mods involved (with versions). Write "none" for a clean install.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and crash report
      description: |
        Please upload `logs/latest.log` and, if there was a crash, the file from `crash-reports/` (drag and drop into this field, or link a paste site). Server problems: the server log.
      placeholder: Drop files here or paste a link.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I use the QNet jar whose name contains my Minecraft version, for my loader.
          required: true
        - label: I searched the existing issues for this problem.
          required: true
